# Builds the web version of the Gipsy app (for iPhone/iPad "Add to Home Screen").
#
# - On a pull request: just checks that it still builds.
# - On main (or Run workflow): also publishes Gipsy-Web.zip to the "web-app"
#   release, where gipsy_hub\install_web_app.bat downloads it from.
name: Gipsy web app

on:
  push:
    branches: [main]
    paths: ["gipsy_app/**", ".github/workflows/web-app.yml"]
  pull_request:
    paths: ["gipsy_app/**", ".github/workflows/web-app.yml"]
  workflow_dispatch:

concurrency:
  group: web-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # to update the web-app release
    defaults:
      run:
        working-directory: gipsy_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      # --no-web-resources-cdn: everything comes from your hub, nothing from Google's servers.
      - run: flutter build web --release --no-web-resources-cdn
      - name: Zip the web app
        run: cd build/web && zip -qr ../../../Gipsy-Web.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: gipsy-web
          path: Gipsy-Web.zip
      - name: Publish to the web-app release
        if: github.event_name != 'pull_request'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete web-app --yes --cleanup-tag || true
          gh release create web-app Gipsy-Web.zip --target "$GITHUB_SHA" --prerelease \
            --title "Gipsy web app (latest)" \
            --notes "Newest web build of the Gipsy app. On the PC, run gipsy_hub\\install_web_app.bat to install it. See docs/WEB-APP.md."
