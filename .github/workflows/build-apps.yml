# Builds the Gipsy app for Windows and iPhone on GitHub's free cloud machines.
# Go to the Actions tab -> "Build Gipsy apps" -> Run workflow. When it finishes,
# download "gipsy-windows" and "gipsy-ios-unsigned" from the run page.
name: Build Gipsy apps

on:
  workflow_dispatch:
    inputs:
      build_mac:
        description: "Also build the Mac app (only if you own a Mac)"
        type: boolean
        default: false
  push:
    tags: ["v*"]

# A newer run replaces an older one, so Mac jobs don't pile up in the queue.
concurrency:
  group: build-apps
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: gipsy_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: flutter build windows --release
      - name: Zip the app
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath ../Gipsy-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: gipsy-windows
          path: Gipsy-Windows.zip

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: gipsy_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned .ipa (Sideloadly signs it with your Apple ID)
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr ../Gipsy-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: gipsy-ios-unsigned
          path: Gipsy-unsigned.ipa

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gipsy_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk ../Gipsy-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: gipsy-android
          path: Gipsy-Android.apk

  macos:
    # Waits for the iPhone build so only one Mac machine is needed at a time.
    needs: ios
    if: ${{ inputs.build_mac }}
    runs-on: macos-latest
    defaults:
      run:
        working-directory: gipsy_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Zip the app
        run: ditto -c -k --keepParent build/macos/Build/Products/Release/Gipsy.app ../Gipsy-Mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: gipsy-mac
          path: Gipsy-Mac.zip

  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gipsy_app
    steps:
      - uses: actions/checkout@v4
      - name: Linux build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release
      - run: tar -czf ../Gipsy-Linux.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: gipsy-linux
          path: Gipsy-Linux.tar.gz
