name: Gipsy Hub (Docker)

on:
  push:
    paths: ["gipsy_hub/**", "docker-compose.yml", ".github/workflows/hub-docker.yml"]
  pull_request:
    paths: ["gipsy_hub/**", "docker-compose.yml", ".github/workflows/hub-docker.yml"]
  workflow_dispatch:

concurrency:
  group: hub-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check docker-compose.yml
        run: cp .env.example .env && docker compose config -q
      - name: Build the hub image
        run: docker build -t gipsy-hub:ci gipsy_hub
      - name: Run the hub's offline tests inside the image
        run: docker run --rm -v "$PWD/gipsy_hub:/src" -w /src -e GIPSY_DATA_DIR=/tmp/gipsy gipsy-hub:ci python -m unittest discover tests -v
      - name: Start the container and check /api/health
        run: |
          docker run -d --name hub -p 8765:8765 gipsy-hub:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/api/health; then echo; exit 0; fi
            sleep 2
          done
          docker logs hub
          exit 1
