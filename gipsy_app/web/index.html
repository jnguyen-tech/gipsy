<!DOCTYPE html>
<html>
<head>
  <!--
    Gipsy's web version. On iPhone/iPad: open it in Safari, tap Share,
    then "Add to Home Screen". It then opens full screen like an app.

    $FLUTTER_BASE_HREF is filled in by `flutter build web` (default "/").
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Gipsy, your local AI assistant.">

  <!-- Fill the whole screen, including under the notch. The app's SafeArea
       keeps buttons out of the way of the notch and home bar. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- iPhone/iPad: open full screen from the Home Screen, with Gipsy's icon. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gipsy">
  <meta name="theme-color" content="#0A0F1C">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Gipsy</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Dark while the app loads, instead of a white flash. */
    html, body { margin: 0; height: 100%; background: #0A0F1C; }
    #loading {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #8E97B0; font: 600 12px -apple-system, system-ui, sans-serif; letter-spacing: 4px;
    }
  </style>
</head>
<body>
  <div id="loading">STARTING GIPSY&hellip;</div>
  <script>
    // Hide the loading text as soon as Flutter draws its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el) el.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
